<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Home{% endblock %} | Unleased</title>
  <style>
    :root {
      --blue: #13294b;
      --orange: #e84a27;
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1d2433;
      --muted: #6a7385;
      --line: #e1e4ea;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: var(--blue); }
    .muted { color: var(--muted); }

    /* Header / navbar */
    .site-header { background: var(--blue); color: #fff; }
    .site-header__inner {
      max-width: 1100px; margin: 0 auto; padding: 14px 20px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand { color: #fff; font-size: 1.4rem; font-weight: 700; text-decoration: none; }
    .brand span { color: var(--orange); }
    .nav { display: flex; flex-wrap: wrap; gap: 6px; }
    .nav a {
      color: #dfe4ee; text-decoration: none; font-size: 0.9rem;
      padding: 6px 12px; border-radius: 999px;
    }
    .nav a:hover { background: rgba(255, 255, 255, 0.12); }
    .nav a.active { background: var(--orange); color: #fff; }

    /* Page layout */
    .page { flex: 1; width: 100%; max-width: 1100px; margin: 0 auto; padding: 28px 20px 40px; }
    .page-head {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end;
      gap: 12px; margin-bottom: 22px;
    }
    .page-head h1 { margin: 0; font-size: 1.8rem; }
    .page-head p { margin: 2px 0 0; }
    .tag {
      font-size: 0.8rem; background: #fff; border: 1px solid var(--line);
      padding: 4px 10px; border-radius: 999px; color: var(--muted);
    }

    /* Listing cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 18px; display: flex; flex-direction: column; gap: 6px;
    }
    .card__top { display: flex; gap: 6px; }
    .card__title { margin: 4px 0 0; font-size: 1.05rem; line-height: 1.3; }
    .card__title a { text-decoration: none; }
    .card__title a:hover { text-decoration: underline; }
    .card p { margin: 0; }
    .price { font-size: 1.4rem; font-weight: 700; }
    .price span { font-size: 0.9rem; font-weight: 400; color: var(--muted); }
    .price em { font-size: 0.8rem; font-style: normal; color: #1b7a43; margin-left: 8px; }
    .specs, .dates { font-size: 0.9rem; }
    .desc { font-size: 0.9rem; color: var(--muted); }

    .badge {
      font-size: 0.72rem; font-weight: 600; padding: 2px 9px; border-radius: 999px;
      background: #e8ebf1; color: var(--blue);
    }
    .badge--available { background: #dff3e6; color: #17683a; }
    .badge--pending { background: #fdf0d2; color: #8a5a00; }
    .badge--filled { background: #f6dcd8; color: #9a2a18; }
    .badge--verified { background: var(--blue); color: #fff; }

    /* Empty state */
    .empty-state {
      grid-column: 1 / -1; text-align: center; background: var(--card);
      border: 2px dashed var(--line); border-radius: 12px; padding: 48px 20px;
    }
    .empty-state h2 { margin: 0 0 6px; }
    .empty-state p { margin: 0; color: var(--muted); }

    /* Detail page */
    .detail { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
    .detail h1 { margin: 8px 0 4px; }
    .detail ul { padding-left: 20px; }

    /* Footer */
    .site-footer { text-align: center; padding: 20px; font-size: 0.85rem; color: var(--muted); border-top: 1px solid var(--line); }
    .site-footer p { margin: 0; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% include "partials/_navbar.html" %}

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/_footer.html" %}
</body>
</html>
